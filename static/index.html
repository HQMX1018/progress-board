<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardOrder · 协作看板</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<section id="login" class="login-screen" hidden><form id="login-form" class="login-card"><div class="eyebrow">CARDORDER WORKSPACE</div><h1>协作看板</h1><p class="muted">使用 Bug 平台已有登录标识进入。</p><label for="userid">登录标识</label><input id="userid" name="userid" autocomplete="username" required maxlength="100" placeholder="与 Bug 平台相同"><p class="small muted">沿用现有内网平台的身份识别方式。</p><button class="btn primary" type="submit">进入看板 →</button><p id="login-error" class="error" role="alert"></p></form></section>
<div id="workspace" hidden><aside><div class="brand"><span class="logo">▥</span>协作看板</div><div class="nav-label">工作空间</div><nav aria-label="主导航"><button class="nav active" data-page="overview">▦　每日总览</button><button class="nav" data-page="requests">▤　我的需求</button><div class="request-subnav"><button class="nav" data-page="requests">未完成</button><button class="nav" data-page="requests_done">已完成</button></div><button class="nav" data-page="daily">◷　每日简报</button><button class="nav" data-page="weekly">▣　每周简报</button><button class="nav" data-page="ledger">▤　总报记录</button><button class="nav" data-page="feedback">✎　意见反馈</button><button class="nav" data-page="agent">⌘　Agent 接口</button></nav><div class="side-bottom"><span class="dot"></span>Bug 平台 · 只读接入<p>计划、汇报与反馈独立保存</p><button class="text-btn" id="logout">退出登录</button></div></aside>
<div class="app"><header><span id="breadcrumb" class="muted">每日总览</span><div class="actions"><span id="identity"></span><span class="badge">内网协作</span></div></header><main><div class="intro"><div><h1 id="page-title">当前待处理，今日已完成</h1><p class="muted" id="page-description">早上看安排，晚上看结果。工作数据自动汇总。</p></div><div class="actions"><label class="sr-only" for="day">查看日期</label><input type="date" id="day"><button class="btn" id="refresh">刷新</button><button class="btn primary" id="new-work">＋ 录入工作</button></div></div><p id="load-error" class="notice error" hidden role="alert"></p><p id="read-status" class="small muted"></p><div id="content" aria-live="polite"></div><footer>Bug 平台只读接入 · 计划日期由人工 / Agent 明确填写 · 计划、新增、完成可能重叠，不直接相加。</footer></main></div></div>
<dialog id="work-dialog"><form id="work-form"><div class="work-top"><h2>录入计划 / 新增工作</h2><button type="button" class="text-btn" data-close="work-dialog" aria-label="关闭">✕</button></div><label for="work-title">工作项</label><input id="work-title" required maxlength="200" placeholder="例如：通知接口联调"><div class="form-grid"><div><label for="work-state">工作状态</label><select id="work-state"><option value="planned">计划工作</option><option value="current">当前处理</option></select></div><div><label for="work-plan">计划日期（可选）</label><input id="work-plan" type="date"></div><div><label for="work-due">预计完成日期（可选）</label><input id="work-due" type="date"></div></div><label for="work-children">子项（每行一项）</label><textarea id="work-children" required rows="4" placeholder="确认字段&#10;完成联调&#10;验证结果"></textarea><label for="work-next">下一步</label><textarea id="work-next" rows="2" maxlength="1000"></textarea><p class="muted small">负责人固定为当前登录人；通过 Agent 也可录入和更新。</p><div class="actions end"><button type="button" class="btn" data-close="work-dialog">取消</button><button class="btn primary" type="submit">保存工作</button></div></form></dialog>
<dialog id="update-dialog"><form id="update-form"><div class="work-top"><h2 id="update-title">更新子项</h2><button type="button" class="text-btn" data-close="update-dialog" aria-label="关闭">✕</button></div><label for="child-status">处理状态</label><select id="child-status"><option value="pending">未开工</option><option value="processed">处理中（待验证）</option><option value="verified">已验收</option></select><label for="child-note">处理记录 / 验收依据</label><textarea id="child-note" rows="4" maxlength="4000"></textarea><label for="child-url">证据链接（可选）</label><input id="child-url" type="url" placeholder="https://..."><p class="small muted">已处理或已验收必须提供记录或证据。所有子项验收后，再将工作标记完成。</p><div class="actions end"><button class="btn primary" type="submit">保存更新</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
